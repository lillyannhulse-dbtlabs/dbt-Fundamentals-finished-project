macros:
  - name: grant_select
    description: a macro that grants select privs on schema on target.schema to target.role unless otherwise specified 
    arguments:
      - name: schema
        type: string
        description: schema we want to grant privs on, by default is our target schema 
      - name: role
        type: string
        description: role we want to grant privs to, by default is our target role
  - name: union_tables_by_prefix
    description: a macro that will union tables by their prefix 
    arguments:
      - name: database
        description: the database with the tables in
      - name: schema
        description: the schema with the tables 
      - name: prefix
        description: the prefix the tables will be unioned on 